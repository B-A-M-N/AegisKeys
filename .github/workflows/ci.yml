name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Embedded asset gate
        run: make assets-check

      - name: Mandatory cross-platform build gate
        run: make cross-build

      - name: Test
        run: go test ./...

      - name: TCP integration tests
        env:
          AEGISKEYS_ALLOW_TCP_TESTS: "1"
        run: go test ./internal/bridge ./internal/provider

      - name: Unix-socket broker integration tests
        env:
          AEGISKEYS_RUN_SOCKET_E2E: "1"
        run: go test ./internal/broker -run 'TestBrokerUnixSocketE2E|TestBrokerConcurrentResolveRotateImmediateRevocation' -count=1

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Adapter render/no-leak verification
        run: go run . adapter verify

      - name: Release cross-compile smoke
        run: |
          GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags "-s -w -X aegiskeys/cmd.version=ci" -o /tmp/aegiskeys_linux_amd64 .
          GOOS=linux GOARCH=arm64 go build -buildvcs=false -ldflags "-s -w -X aegiskeys/cmd.version=ci" -o /tmp/aegiskeys_linux_arm64 .
          GOOS=darwin GOARCH=amd64 go build -buildvcs=false -ldflags "-s -w -X aegiskeys/cmd.version=ci" -o /tmp/aegiskeys_darwin_amd64 .
          GOOS=darwin GOARCH=arm64 go build -buildvcs=false -ldflags "-s -w -X aegiskeys/cmd.version=ci" -o /tmp/aegiskeys_darwin_arm64 .
